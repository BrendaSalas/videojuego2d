<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cementerio Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game">
        <header class="top-bar">
            <div class="title">
                <span class="skull">☠</span>
                <h1>CEMENTERIO PIXEL</h1>
                <span class="skull">☠</span>
            </div>

            <div class="game-info">
                <span class="score">
                    ALMAS ATRAPADAS: <strong id="score">0</strong>
                </span>
                <span id="status">PRESIONA INICIAR</span>
            </div>
        </header>

        <section id="game-area">
            <canvas
                id="gameCanvas"
                width="320"
                height="180"
                aria-label="Videojuego de criaturas pixel art en un cementerio">
            </canvas>

            <div id="startOverlay">
                <div class="overlay-box">
                    <div class="overlay-skull">☠</div>
                    <h2>CEMENTERIO PIXEL</h2>
                    <p>¿Te atreves a entrar?</p>
                    <button id="startButton">▶ INICIAR JUEGO</button>
                </div>
            </div>
        </section>

        <footer class="bottom-bar">
            <div class="controls">
                <button id="restartButton">↻ REINICIAR</button>
                <button id="musicButton">♫ ACTIVAR MÚSICA</button>
            </div>

            <p class="instructions">
                ATRAPA LAS CRIATURAS · ¡CUIDADO CON LOS SUSTOS!
            </p>
            <p class="credits">Una noche de terror en pixel art</p>
        </footer>
    </main>

    <audio
        id="backgroundMusic"
        src="audio/terror.mp3"
        loop
        preload="auto">
    </audio>

    <audio
        id="screamerAudio"
        src="audio/screamer.mp3"
        preload="auto">
    </audio>

    <script src="script.js"></script>
</body>
</html>
